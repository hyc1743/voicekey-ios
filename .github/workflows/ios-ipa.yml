name: Build iPhone IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      # 快速失败：先只做类型检查（不生成代码、不签名），几十秒内暴露绝大多数编译错误。
      - name: Type-check gate (fast fail)
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "== app target（含 ObjC 桥接头）=="
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios17.0 -swift-version 5 \
            -import-objc-header VoiceKey/VoiceKey-Bridging-Header.h \
            -I . \
            $(find Shared VoiceKey -name '*.swift' | sort)
          echo "== ObjC 语法 =="
          for file in $(find VoiceKey -name '*.m' | sort); do
            xcrun clang -fsyntax-only -fobjc-arc -x objective-c -isysroot "$SDK" \
              -target arm64-apple-ios17.0 -I VoiceKey "$file"
          done
          echo "== keyboard target =="
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios17.0 -swift-version 5 \
            -application-extension \
            $(find Shared VoiceKeyKeyboard -name '*.swift' | sort)
          echo "type-check OK"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned device app (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VoiceKey.xcodeproj \
            -scheme VoiceKey \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/VoiceKey.app"
          test -d "$APP"
          test -d "$APP/PlugIns/VoiceKeyKeyboard.appex"

          echo "-- Release 产物校验 --"
          # Release 构建不应残留调试段
          if otool -l "$APP/VoiceKey" | grep -q __DWARF; then
            echo "::error::Release 产物里出现了 __DWARF 段"; exit 1
          fi

          echo "-- plist 关键项 --"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP/PlugIns/VoiceKeyKeyboard.appex/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:RequestsOpenAccess' "$APP/PlugIns/VoiceKeyKeyboard.appex/Info.plist"
          echo "-- 画中画待命素材 --"
          find "$APP" -name 'Standby.mp4' | grep -q .
          find "$APP" -name 'StandbyHidden.mp4' | grep -q .

          mkdir -p dist "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/VoiceKey.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/VoiceKey-unsigned.ipa" Payload)
          unzip -t dist/VoiceKey-unsigned.ipa | tail -1
          lipo -archs "$APP/VoiceKey"
          (cd dist && shasum -a 256 VoiceKey-unsigned.ipa | tee SHA256SUMS.txt)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceKey-unsigned-ipa
          path: |
            dist/VoiceKey-unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

  # 推 v* tag 时，把同一次 Release 构建的 IPA 附到 GitHub Release，方便直接下载。
  release:
    needs: ipa
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VoiceKey-unsigned-ipa
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## 未签名 IPA（Release 构建）

          CI 使用 `xcodebuild -configuration Release` 构建，**未做代码签名**；安装前请用自己的证书重签
          （AltStore / Sideloadly / ESign 均可）。

          ### 安装要点
          - 需要 iOS 17 或更高版本。
          - 重签后到「设置 → 通用 → 键盘 → 键盘」添加 VoiceKey，并打开 **允许完全访问**，否则键盘无法与主 App 通信。
          - 免费 Apple ID 拿不到 App Group：键盘与主 App 会自动降级为 Darwin 通知 + 剪贴板，功能可用但状态显示更少。
          - 付费账号请在两个 `.entitlements` 里把 `group.dev.hyc.voicekey` 换成你自己的 App Group ID 后再重签。

          ### 首次使用
          1. 打开 App，填入**语音识别 Key**（默认阿里云百炼 `qwen-audio-3.1-asr-flash`）与**整理 Key**（默认 DeepSeek `deepseek-chat`）。
          2. 想跨 App 不切前台，可在设置里选择待命方式：静音输出（无私有 API）或画中画（实验）。
          3. 键盘点麦克风说话，识别与整理完成后自动插入当前输入框。

          ### 注意
          - 画中画待命包含 AVKit 私有方法（可单独关闭），上架审核前应移除。
          - 校验和见附件 `SHA256SUMS.txt`。
          NOTES
          gh release create "$tag" dist/VoiceKey-unsigned.ipa dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "VoiceKey ${tag#v}（未签名 IPA）" \
            --notes-file "$RUNNER_TEMP/notes.md"
