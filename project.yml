name: VoiceKey
options:
  bundleIdPrefix: dev.hyc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  VoiceKey:
    type: application
    platform: iOS
    sources:
      - path: VoiceKey
      - path: Shared
    info:
      path: VoiceKey/Info.plist
      properties:
        CFBundleDisplayName: VoiceKey
        CFBundleShortVersionString: "0.1.13"
        CFBundleVersion: "14"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "VoiceKey 需要使用麦克风把你说的话变成文字。"
        NSLocalNetworkUsageDescription: "VoiceKey 可连接你在局域网里自建的模型服务（如 Ollama、LM Studio）。"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        LSApplicationQueriesSchemes:
          - barcelona
          - claude
          - discord
          - evernote
          - fb
          - fb-messenger
          - googlechrome
          - googledocs
          - googledrive
          - googlemaps
          - instagram
          - jira
          - lark
          - linear
          - mailto
          - mobilenotes
          - monday
          - ms-outlook
          - msteams
          - nflx
          - notion
          - openai
          - perplexity-app
          - pinterest
          - reddit
          - slack
          - snapchat
          - snssdk1128
          - snssdk1233
          - spotify
          - substack
          - tg
          - trello
          - twitter
          - uber
          - ubereats
          - walmart
          - weixin
          - whatsapp
          - wxwork
          - x-safari-https
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: dev.hyc.voicekey
            CFBundleURLSchemes:
              - voicekey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hyc.voicekey
        CODE_SIGN_ENTITLEMENTS: VoiceKey/VoiceKey.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: VoiceKey/VoiceKey-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: VoiceKeyKeyboard
        embed: true

  VoiceKeyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: VoiceKeyKeyboard
      - path: Shared
    info:
      path: VoiceKeyKeyboard/Info.plist
      properties:
        CFBundleDisplayName: VoiceKey
        CFBundleShortVersionString: "0.1.13"
        CFBundleVersion: "14"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hyc.voicekey.keyboard
        CODE_SIGN_ENTITLEMENTS: VoiceKeyKeyboard/VoiceKeyKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO

schemes:
  VoiceKey:
    build:
      targets:
        VoiceKey: all
